<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a2e39"/>
      <stop offset="100%" stop-color="#14171d"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="30" fill="url(#bg)"/>
  
  <!-- Dominus Hood Shadow -->
  <path d="M 120 100 C 120 40, 280 40, 280 100 C 310 160, 310 270, 290 320 C 260 300, 240 280, 200 290 C 160 280, 140 300, 110 320 C 90 270, 90 160, 120 100 Z" fill="#18181b" stroke="#3b4252" stroke-width="4"/>
  
  <!-- Hood Inner Void -->
  <path d="M 150 140 C 150 110, 250 110, 250 140 C 265 190, 260 250, 200 255 C 140 250, 135 190, 150 140 Z" fill="#090a0f"/>
  
  <!-- Glowing White Eyes -->
  <ellipse cx="175" cy="180" rx="14" ry="7" fill="#ffffff" filter="url(#glow)"/>
  <ellipse cx="225" cy="180" rx="14" ry="7" fill="#ffffff" filter="url(#glow)"/>

  <!-- Golden Ring / Buttons -->
  <circle cx="150" cy="285" r="8" fill="#eab308" stroke="#ca8a04" stroke-width="2"/>
  <circle cx="250" cy="285" r="8" fill="#eab308" stroke="#ca8a04" stroke-width="2"/>
  <path d="M 150 285 L 200 315 L 250 285" fill="none" stroke="#eab308" stroke-width="4"/>

  <!-- Feathers -->
  <path d="M 100 130 C 60 110, 60 170, 110 170 Z" fill="#ffffff"/>
  <path d="M 300 130 C 340 110, 340 170, 290 170 Z" fill="#ffffff"/>

  <text x="200" y="370" font-family="Arial, sans-serif" font-weight="900" font-size="20" fill="#e2e8f0" text-anchor="middle">DOMINUS EMPYREUS</text>
</svg>
