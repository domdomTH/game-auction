<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roblox Item Auction - ตลาดประมูลไอเทมสุดแรร์ Real-time</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Kanit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body {
      font-family: 'Kanit', sans-serif;
      background: #191b1d;
      color: #ffffff;
      background-image: 
        radial-gradient(#2b2f36 15%, transparent 16%),
        radial-gradient(#22262c 15%, transparent 16%);
      background-size: 40px 40px;
      background-position: 0 0, 20px 20px;
    }
    .rbx-font {
      font-family: 'Fredoka', 'Kanit', sans-serif;
    }
    .rbx-card {
      background: #232527;
      border: 3px solid #393b3d;
      border-radius: 18px;
      box-shadow: 0 8px 0 #111214;
      transition: all 0.15s ease-in-out;
    }
    .rbx-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 0 #111214;
      border-color: #00a2ff;
    }
    .rbx-btn-green {
      background: #00b06f;
      box-shadow: 0 5px 0 #00754a;
      border-radius: 12px;
      font-weight: 700;
      transition: all 0.1s;
    }
    .rbx-btn-green:hover {
      background: #02c77f;
      transform: translateY(-2px);
      box-shadow: 0 7px 0 #00754a;
    }
    .rbx-btn-green:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #00754a;
    }
    .rbx-btn-blue {
      background: #00a2ff;
      box-shadow: 0 4px 0 #006eb0;
      border-radius: 10px;
      font-weight: 700;
      transition: all 0.1s;
    }
    .rbx-btn-blue:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #006eb0;
    }
    .robux-icon {
      display: inline-block;
      background: #00a2ff;
      color: #fff;
      font-weight: 900;
      border-radius: 6px;
      padding: 1px 6px;
      font-size: 0.85em;
      margin-right: 4px;
    }
    .bid-flash {
      animation: flashRbx 0.7s ease-in-out;
    }
    @keyframes flashRbx {
      0% { transform: scale(1); background-color: #00a2ff; color: #fff; }
      50% { transform: scale(1.1); background-color: #00b06f; color: #fff; }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body class="p-3 md:p-6 min-h-screen">

  <!-- Top Navigation Bar สไตล์ Roblox (ไม่มีปุ่ม Admin ให้คนอื่นเห็น) -->
  <header class="max-w-6xl mx-auto bg-[#232527] border-b-4 border-[#111214] px-5 py-3.5 rounded-2xl flex flex-wrap justify-between items-center mb-8 gap-4 shadow-xl">
    <div class="flex items-center gap-3">
      <!-- Roblox Icon Style Logo -->
      <div class="w-11 h-11 bg-red-600 rounded-xl flex items-center justify-center font-black text-2xl text-white shadow-md transform -rotate-6 border-2 border-red-400">
        R
      </div>
      <div>
        <h1 class="text-2xl font-black rbx-font tracking-wide text-white flex items-center gap-2">
          ROBLOX <span class="text-[#00a2ff]">AUCTION</span>
        </h1>
        <p class="text-xs text-gray-400">ตลาดเคาะประมูล Limited & Gears แบบสดๆ</p>
      </div>
    </div>

    <!-- แผงผู้เล่นทั่วไป -->
    <div class="flex items-center gap-3">
      <div class="flex items-center gap-2 bg-[#191b1d] px-3.5 py-1.5 rounded-xl border-2 border-[#393b3d]">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-ping"></span>
        <span class="text-xs text-emerald-400 font-bold">LIVE ONLINE</span>
      </div>

      <div class="flex items-center gap-2 bg-[#191b1d] px-3 py-1.5 rounded-xl border-2 border-[#393b3d]">
        <span class="text-xs text-gray-400">👤 ชื่อของคุณ:</span>
        <input type="text" id="usernameInput" value="Robloxian_Player" class="bg-transparent text-amber-400 font-bold text-xs w-28 focus:outline-none text-center">
      </div>
    </div>
  </header>

  <!-- รายการไอเทมการประมูล -->
  <main class="max-w-6xl mx-auto">
    <div id="auctionGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-7">
      <!-- Cards rendered by JS -->
    </div>
  </main>

  <!-- Notification Toast -->
  <div id="toast" class="fixed bottom-6 right-6 hidden z-50 text-white px-5 py-3.5 rounded-2xl shadow-2xl font-bold text-sm border-2 transition-all flex items-center gap-2">
    <span id="toastIcon">🔔</span>
    <span id="toastMsg">แจ้งเตือน</span>
  </div>

  <script>
    const socket = io();
    let auctionsData = [];

    const toast = document.getElementById('toast');
    const toastMsg = document.getElementById('toastMsg');
    const toastIcon = document.getElementById('toastIcon');
    const usernameInput = document.getElementById('usernameInput');

    function showToast(msg, isError = true) {
      toastMsg.innerText = msg;
      toastIcon.innerText = isError ? '❌' : '🎉';
      toast.className = `fixed bottom-6 right-6 flex items-center gap-2 px-5 py-3.5 rounded-2xl shadow-2xl z-50 text-sm font-bold border-2 ${
        isError ? 'bg-red-600 border-red-400 text-white' : 'bg-[#00b06f] border-emerald-300 text-white'
      }`;
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 3500);
    }

    socket.on('init_data', (data) => {
      auctionsData = data;
      renderAuctions();
    });

    socket.on('bid_updated', (updated) => {
      const item = auctionsData.find(a => a.id === updated.auctionId);
      if (item) {
        item.currentPrice = updated.currentPrice;
        item.highestBidder = updated.highestBidder;
        item.endTime = updated.endTime;
        item.history = updated.history;

        updateCard(item);
        showToast(`💥 ${updated.highestBidder} เคาะราคาใหม่ไอเทม #${item.id}!`, false);
      }
    });

    socket.on('bid_error', (err) => {
      showToast(err.message, true);
    });

    function placeBid(id, amount) {
      const user = usernameInput.value.trim() || 'Player_' + Math.floor(Math.random() * 899 + 100);
      socket.emit('place_bid', {
        auctionId: id,
        bidderName: user,
        bidAmount: amount
      });
    }

    function renderAuctions() {
      const container = document.getElementById('auctionGrid');
      container.innerHTML = auctionsData.map(item => {
        const isCancelled = item.status === 'cancelled';
        return `
        <div id="card-${item.id}" class="rbx-card flex flex-col justify-between overflow-hidden relative">
          ${isCancelled ? '<div class="absolute inset-0 bg-black/80 backdrop-blur-[2px] z-20 flex flex-col items-center justify-center font-black text-red-500 text-2xl tracking-wider uppercase border-4 border-red-600/50 m-2 rounded-xl">⛔ ยกเลิกการประมูลแล้ว</div>' : ''}
          
          <div>
            <!-- ภาพไอเทม Roblox -->
            <div class="relative h-60 bg-[#161718] flex items-center justify-center p-4 border-b-2 border-[#393b3d]">
              <img src="${item.image}" alt="${item.title}" class="max-h-52 object-contain filter drop-shadow-[0_10px_10px_rgba(0,0,0,0.6)] hover:scale-105 transition duration-300">
              
              <span class="absolute top-3 left-3 bg-[#111214]/90 text-[#00a2ff] text-xs font-bold px-3 py-1 rounded-xl border border-[#393b3d]">
                🏷️ ${item.game}
              </span>
              <span id="badge-${item.id}" class="absolute top-3 right-3 bg-red-600 text-white text-xs font-black px-3 py-1 rounded-xl shadow-lg">
                🔴 LIVE
              </span>
            </div>

            <!-- รายละเอียด -->
            <div class="p-5">
              <h2 class="text-xl font-bold text-white mb-1.5 leading-snug rbx-font">${item.title}</h2>
              <p class="text-xs text-gray-400 mb-4 line-clamp-2">${item.description}</p>

              <!-- กล่องราคา Robux -->
              <div class="bg-[#191b1d] rounded-2xl p-4 border-2 border-[#303236] mb-3">
                <div class="flex justify-between items-center mb-2">
                  <span class="text-xs text-gray-400 font-semibold">ราคาประมูลสูงสุด:</span>
                  <div class="flex items-center text-2xl font-black text-white rbx-font">
                    <span class="robux-icon">R$</span>
                    <span id="price-${item.id}" class="transition-all">${item.currentPrice.toLocaleString()}</span>
                  </div>
                </div>
                <div class="flex justify-between items-center text-xs text-gray-400 pt-2 border-t border-[#2a2c30]">
                  <span>ผู้บิดสูงสุด:</span>
                  <span id="bidder-${item.id}" class="font-bold text-amber-400 bg-amber-400/10 px-2 py-0.5 rounded-lg border border-amber-400/30">
                    👑 ${item.highestBidder}
                  </span>
                </div>
              </div>

              <!-- เวลานับถอยหลัง -->
              <div class="flex items-center justify-between bg-[#191b1d] px-3.5 py-2.5 rounded-xl border-2 border-[#303236] mb-4">
                <span class="text-xs text-gray-400 flex items-center gap-1.5 font-bold">
                  ⏱️ นับถอยหลัง:
                </span>
                <span id="timer-${item.id}" class="text-sm font-black text-emerald-400 rbx-font">
                  คำนวณ...
                </span>
              </div>
            </div>
          </div>

          <!-- โซนปุ่มบิด -->
          <div class="p-5 pt-0">
            <div class="grid grid-cols-2 gap-2.5 mb-2.5">
              <button onclick="quickBid(${item.id}, ${item.minBidStep})" ${isCancelled ? 'disabled' : ''} class="rbx-btn-blue text-white text-xs py-2.5">
                +${item.minBidStep.toLocaleString()} R$
              </button>
              <button onclick="quickBid(${item.id}, ${item.minBidStep * 2})" ${isCancelled ? 'disabled' : ''} class="rbx-btn-blue text-white text-xs py-2.5">
                +${(item.minBidStep * 2).toLocaleString()} R$
              </button>
            </div>

            <div class="flex gap-2">
              <input type="number" id="custom-${item.id}" placeholder="ระบุ R$" ${isCancelled ? 'disabled' : ''} class="w-1/2 bg-[#191b1d] border-2 border-[#393b3d] rounded-xl px-3 py-2 text-sm text-white font-bold text-center focus:outline-none focus:border-[#00a2ff]">
              <button onclick="submitCustom(${item.id})" ${isCancelled ? 'disabled' : ''} class="w-1/2 rbx-btn-green text-white text-sm py-2">
                เคาะราคา! 🔥
              </button>
            </div>
          </div>
        </div>
        `;
      }).join('');

      startTimers();
    }

    function quickBid(id, step) {
      const item = auctionsData.find(a => a.id === id);
      if (item) placeBid(id, item.currentPrice + step);
    }

    function submitCustom(id) {
      const inp = document.getElementById(`custom-${id}`);
      const val = Number(inp.value);
      if (val) {
        placeBid(id, val);
        inp.value = '';
      } else {
        showToast('กรุณาระบุจำนวนเงิน Robux (R$)');
      }
    }

    function updateCard(item) {
      const priceElem = document.getElementById(`price-${item.id}`);
      const bidderElem = document.getElementById(`bidder-${item.id}`);
      if (priceElem) {
        priceElem.innerText = item.currentPrice.toLocaleString();
        priceElem.classList.add('bid-flash');
        setTimeout(() => priceElem.classList.remove('bid-flash'), 800);
      }
      if (bidderElem) {
        bidderElem.innerText = `👑 ${item.highestBidder}`;
      }
    }

    function startTimers() {
      setInterval(() => {
        const now = Date.now();
        auctionsData.forEach(item => {
          if (item.status === 'cancelled') return;
          const timerElem = document.getElementById(`timer-${item.id}`);
          if (!timerElem) return;

          const diff = item.endTime - now;
          if (diff <= 0) {
            timerElem.innerText = 'ปิดประมูลแล้ว';
            timerElem.className = 'text-sm font-bold text-gray-500';
            const badge = document.getElementById(`badge-${item.id}`);
            if (badge) {
              badge.innerText = 'ENDED';
              badge.className = 'absolute top-3 right-3 bg-gray-700 text-gray-300 text-xs font-bold px-3 py-1 rounded-xl';
            }
          } else {
            const mins = Math.floor(diff / 60000);
            const secs = Math.floor((diff % 60000) / 1000);
            timerElem.innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')} นาที`;
          }
        });
      }, 1000);
    }
  </script>
</body>
</html>
